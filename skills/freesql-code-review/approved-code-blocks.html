<!doctype html>
<html lang="en">
<head>

  <style>

  --dbuad-page-bg: #f7f7f5;

  --dbuad-surface-soft: #fbfbfa;

.dbuad-freesql-pager,

.is-hidden {

.toast {
  position: fixed;
  right: 20px;

  max-width: min(360px, calc(100% - 40px));

@media (max-width: 900px) {
  .dbuad-freesql-filters {

<body>
  <main id="app" class="shell"></main>
  <script>
window.FREESQL_APPROVED_VIEWER = {
  "localDataUrl": "approved-code-blocks-data.json",
  "remoteDataUrl": "https://raw.githubusercontent.com/BillSawyer-Oracle/oracle-docs/main/skills/freesql-code-review/outputs/approved-code-blocks-data.json",
  "remoteDataUrls": [
    "https://raw.githubusercontent.com/BillSawyer-Oracle/oracle-docs/main/skills/freesql-code-review/outputs/approved-code-blocks-data.json",
    "https://raw.githubusercontent.com/BillSawyer-Oracle/oracle-docs/main/skills/freesql-code-review/approved-code-blocks-data.json"
  ]
};
  </script>
  <script>
const app = document.getElementById("app");
const CONFIG = window.FREESQL_APPROVED_VIEWER || {};
const LOCAL_DATA_URL = CONFIG.localDataUrl || "approved-code-blocks-data.json";
const DEFAULT_REMOTE_DATA_URL = CONFIG.remoteDataUrl || "";
const DEFAULT_REMOTE_DATA_URLS = Array.isArray(CONFIG.remoteDataUrls)
  ? CONFIG.remoteDataUrls.filter(Boolean)
  : [DEFAULT_REMOTE_DATA_URL].filter(Boolean);
const PAGE_SIZE_OPTIONS = [12, 24, 48];
let DATA = emptyData();
const state = {
  search: "",
  schema: "",
  chapter: "",
  pageSize: 12,
  page: 1,
  expandedSql: new Set(),
  copiedMessage: "",
  updateStatus: "",
  loadError: "",
  openDataPrompt: "",
  loading: true,
  updating: false,
};

function emptyData() {
  return {
    available: false,
    message: "No approved runnable PROD code blocks are available.",
    selectedSource: null,
    sources: [],
    summary: {
      approvedBlockCount: 0,
      pageCount: 0,
      schemaCount: 0,
      latestTestedAt: null,
      generatedAt: null,
    },
    options: { schemas: [], chapters: [] },
    pages: [],
    remoteDataUrl: DEFAULT_REMOTE_DATA_URL,
  };
}

function validArtifactData(value) {
  return Boolean(value && typeof value === "object" && value.summary && Array.isArray(value.pages));
}

function normalizeData(value) {
  if (!validArtifactData(value)) {
    return emptyData();
  }
  const base = emptyData();
  const selectedSource = value.selectedSource || null;
  const sourceList = selectedSource ? [selectedSource] : (Array.isArray(value.sources) ? value.sources : []);
  return {
    ...base,
    ...value,
    selectedSource,
    sources: sourceList,
    summary: { ...base.summary, ...(value.summary || {}) },
    options: {
      ...base.options,
      ...(value.options || {}),
      schemas: Array.isArray(value.options?.schemas) ? value.options.schemas : [],
      chapters: Array.isArray(value.options?.chapters) ? value.options.chapters : [],
    },
    pages: Array.isArray(value.pages) ? value.pages : [],
    remoteDataUrl: value.remoteDataUrl || base.remoteDataUrl,
  };
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString();
}

function formatDate(value) {
  if (!value) {
    return "Unknown";
  }
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) {
    return String(value);
  }
  return parsed.toLocaleString();
}

function compactUrl(value) {
  if (!value) {
    return "Source unavailable";
  }
  try {
    const parsed = new URL(value, window.location.href);
    return `${parsed.hostname}${parsed.pathname}`;
  } catch {
    return String(value);
  }
}

function create(tag, options = {}, children = []) {
  const node = document.createElement(tag);
  if (options.className) {
    node.className = options.className;
  }
  if (options.id) {
    node.id = options.id;
  }
  if (options.text !== undefined) {
    node.textContent = String(options.text);
  }
  if (options.href) {
    node.href = options.href;
  }
  if (options.title) {
    node.title = options.title;
  }
  if (options.target) {
    node.target = options.target;
  }
  if (options.rel) {
    node.rel = options.rel;
  }
  if (options.download) {
    node.download = options.download;
  }
  if (options.disabled !== undefined) {
    node.disabled = Boolean(options.disabled);
  }
  if (options.role) {
    node.setAttribute("role", options.role);
  }
  if (options.tabIndex !== undefined) {
    node.tabIndex = options.tabIndex;
  }
  if (options.type) {
    node.type = options.type;
  }
  if (options.accept) {
    node.accept = options.accept;
  }
  if (options.value !== undefined) {
    node.value = options.value;
  }
  if (options.ariaExpanded !== undefined) {
    node.setAttribute("aria-expanded", String(options.ariaExpanded));
  }
  if (options.ariaDisabled !== undefined) {
    node.setAttribute("aria-disabled", String(options.ariaDisabled));
  }
  if (options.onClick) {
    node.addEventListener("click", options.onClick);
  }
  if (options.onInput) {
    node.addEventListener("input", options.onInput);
  }
  if (options.onChange) {
    node.addEventListener("change", options.onChange);
  }
  for (const child of children) {
    if (child === null || child === undefined) {
      continue;
    }
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function badge(text, tone = "neutral") {
  return create("span", { className: `dbuad-badge dbuad-badge-${tone}`.trim(), text });
}

function resetViewState() {
  state.search = "";
  state.schema = "";
  state.chapter = "";
  state.page = 1;
  state.expandedSql.clear();
}

function resetFilters(focusId = "") {
  state.search = "";
  state.schema = "";
  state.chapter = "";
  state.page = 1;
  state.expandedSql.clear();
  render(focusId);
}

function pageSearchText(page) {
  return [page.pageTitle, page.chapter, page.section, page.pageUrl, `page ${page.pageOrdinal}`]
    .filter(Boolean)
    .join(" ")
    .toUpperCase();
}

function blockSearchText(block) {
  return [
    block.blockId,
    block.blockOrdinal,
    block.schemaName,
    block.schemaLabel,
    block.approvedSql,
  ]
    .filter(Boolean)
    .join(" ")
    .toUpperCase();
}

function visiblePages() {
  if (!DATA.available) {
    return [];
  }
  const search = state.search.trim().toUpperCase();
  return (DATA.pages || [])
    .map((page) => {
      if (state.chapter && page.chapter !== state.chapter) {
        return null;
      }
      const pageHit = !search || pageSearchText(page).includes(search);
      const blocks = (page.blocks || []).filter((block) => {
        if (state.schema && block.schemaName !== state.schema) {
          return false;
        }
        if (search && !pageHit && !blockSearchText(block).includes(search)) {
          return false;
        }
        return true;
      });
      return blocks.length ? { ...page, visibleBlocks: blocks } : null;
    })
    .filter(Boolean);
}

function maxPageFor(pages) {
  return Math.max(1, Math.ceil(pages.length / state.pageSize));
}

function pagedPages(pages) {
  const maxPage = maxPageFor(pages);
  if (state.page > maxPage) {
    state.page = maxPage;
  }
  const start = (state.page - 1) * state.pageSize;
  return pages.slice(start, start + state.pageSize);
}

function updateFilter(key, value, focusId = "") {
  state[key] = value;
  state.page = 1;
  render(focusId);
}

function remoteDataUrl() {
  return remoteDataUrls()[0] || "";
}

function remoteDataUrls() {
  const urls = [];
  try {
    const params = new URLSearchParams(window.location.search);
    const override = params.get("dataUrl");
    if (override) {
      urls.push(override);
    }
  } catch {
    // Ignore malformed query strings.
  }
  urls.push(...DEFAULT_REMOTE_DATA_URLS);
  if (DATA.remoteDataUrl) {
    urls.push(DATA.remoteDataUrl);
  }
  return Array.from(new Set(urls.filter(Boolean)));
}

async function fetchArtifactPayload(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }
  const downloadedData = await response.json();
  if (!validArtifactData(downloadedData)) {
    throw new Error("The JSON is not a FreeSQL code-block data file.");
  }
  return downloadedData;
}

async function fetchArtifactData(url) {
  return normalizeData(await fetchArtifactPayload(url));
}

function loadDataPayload(payload, label) {
  DATA = normalizeData(payload);
  resetViewState();
  state.loadError = "";
  state.openDataPrompt = "";
  state.updateStatus = `Loaded ${label}.`;
}

async function loadLocalData() {
  state.loading = true;
  state.loadError = "";
  state.openDataPrompt = "";
  state.updateStatus = `Loading ${LOCAL_DATA_URL}...`;
  render();
  try {
    loadDataPayload(await fetchArtifactPayload(LOCAL_DATA_URL), LOCAL_DATA_URL);
  } catch (error) {
    DATA = emptyData();
    state.openDataPrompt = window.location.protocol === "file:"
      ? `The page looked for ${LOCAL_DATA_URL} in this folder, but the browser blocked or could not complete the same-folder read. Use Open Data to select it.`
      : `Automatic data load did not complete. Use Open Data to select ${LOCAL_DATA_URL}.`;
    state.updateStatus = "";
  } finally {
    state.loading = false;
    render();
    expandFromHash(false);
  }
}

async function openDataFile(file) {
  if (!file) {
    return;
  }
  state.loading = true;
  state.loadError = "";
  state.openDataPrompt = "";
  state.updateStatus = `Opening ${file.name}...`;
  render();
  try {
    const payload = JSON.parse(await file.text());
    if (!validArtifactData(payload)) {
      throw new Error("The selected file is not a FreeSQL code-block data file.");
    }
    loadDataPayload(payload, file.name);
    showToast("Data file loaded.");
  } catch (error) {
    DATA = emptyData();
    state.loadError = `Open Data failed: ${error.message}. Select ${LOCAL_DATA_URL} from the same folder as this HTML.`;
    state.openDataPrompt = "";
    state.updateStatus = "";
    showToast("Open Data failed.");
  } finally {
    state.loading = false;
    render();
    expandFromHash(false);
  }
}

function downloadJson(data) {
  const fileName = LOCAL_DATA_URL.split("/").pop() || "approved-code-blocks-data.json";
  const blob = new Blob([`${JSON.stringify(data, null, 2)}\n`], { type: "application/json" });
  const href = URL.createObjectURL(blob);
  const link = create("a", { href, download: fileName });
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(href), 0);
}

async function updateData() {
  const urls = remoteDataUrls();
  if (!urls.length) {
    state.updateStatus = "No GitHub JSON URL is configured.";
    showToast("No GitHub JSON URL configured.");
    render();
    return;
  }
  state.updating = true;
  state.loadError = "";
  state.openDataPrompt = "";
  state.updateStatus = `Downloading latest JSON from ${compactUrl(urls[0])}...`;
  render();
  const attempts = [];
  try {
    let downloadedData = null;
    let successfulUrl = "";
    for (const url of urls) {
      try {
        downloadedData = await fetchArtifactPayload(url);
        successfulUrl = url;
        break;
      } catch (error) {
        attempts.push(`${compactUrl(url)} (${error.message})`);
      }
    }
    if (!downloadedData) {
      throw new Error(attempts.join("; "));
    }
    const downloadPayload = { ...downloadedData, remoteDataUrl: downloadedData.remoteDataUrl || successfulUrl };
    const updatedData = normalizeData(downloadPayload);
    updatedData.remoteDataUrl = updatedData.remoteDataUrl || successfulUrl;
    DATA = updatedData;
    resetViewState();
    downloadJson(downloadPayload);
    state.updateStatus = `Downloaded latest JSON generated ${formatDate(DATA.summary.generatedAt)}. Save it as ${LOCAL_DATA_URL} next to this HTML to make it the startup data.`;
    showToast("Latest JSON downloaded.");
  } catch (error) {
    state.updateStatus = `Update failed: ${error.message}.`;
    showToast("Update failed.");
  } finally {
    state.updating = false;
    render();
  }
}

function expandFromHash(scroll = true) {
  const anchor = decodeURIComponent(window.location.hash.replace(/^#/, ""));
  if (!anchor || !(DATA.pages || []).length) {
    return;
  }
  const page = (DATA.pages || []).find((candidate) => {
    return candidate.anchor === anchor || (candidate.blocks || []).some((block) => block.anchor === anchor);
  });
  if (!page) {
    return;
  }
  const pageIndex = visiblePages().findIndex((candidate) => candidate.anchor === page.anchor);
  if (pageIndex >= 0) {
    state.page = Math.floor(pageIndex / state.pageSize) + 1;
  }
  const block = (page.blocks || []).find((candidate) => candidate.anchor === anchor);
  if (block) {
    state.expandedSql.add(String(block.blockId));
  }
  render();
  if (scroll) {
    window.requestAnimationFrame(() => {
      const target = document.getElementById(anchor);
      if (target) {
        target.scrollIntoView({ block: "start" });
      }
    });
  }
}

function showToast(message) {
  state.copiedMessage = message;
  render();
  window.setTimeout(() => {
    state.copiedMessage = "";
    render();
  }, 1800);
}

async function copyText(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text || "");
    } else {
      const textArea = document.createElement("textarea");
      textArea.value = text || "";
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand("copy");
      textArea.remove();
    }
    showToast(label);
  } catch {
    const textArea = document.createElement("textarea");
    textArea.value = text || "";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    showToast("Copy blocked. The text is selected for manual copy.");
  }
}

function renderFilter(labelText, control) {
  return create("label", {}, [create("span", { text: labelText }), control]);
}

function renderOpenDataPanel(message, isError = false) {
  const inputId = "approved-data-file-input";
  return create("div", { className: isError ? "dbuad-alert" : "dbuad-progress-panel" }, [
    create("p", { text: message }),
    create("div", { className: "dbuad-alert-actions" }, [
      create("button", {
        className: "dbuad-button",
        type: "button",
        text: "Open Data",
        onClick: () => {
          const input = document.getElementById(inputId);
          if (input) {
            input.click();
          }
        },
      }),
      create("input", {
        id: inputId,
        className: "dbuad-file-input",
        type: "file",
        accept: "application/json,.json",
        onChange: (event) => {
          openDataFile(event.target.files && event.target.files[0]);
          event.target.value = "";
        },
      }),
    ]),
  ]);
}

function renderHeader() {
  return create("div", { className: "dbuad-surface-header" }, [
    create("div", { className: "dbuad-header-title" }, [
      create("p", { className: "dbuad-kicker", text: "Workflow" }),
      create("h1", { text: "View Code Blocks" }),
    ]),
    create("div", { className: "dbuad-header-actions" }, [
      create("div", { className: "dbuad-badges" }, [
        badge("2026.06"),
        state.loading ? badge("Loading") : null,
        state.updating ? badge("Updating") : null,
      ]),
      create("button", {
        className: "dbuad-button",
        type: "button",
        text: state.updating ? "Updating..." : "Update Data",
        disabled: state.updating,
        title: remoteDataUrl() || "No GitHub JSON URL is configured.",
        onClick: updateData,
      }),
    ]),
  ]);
}

function renderFilters() {
  const schema = create("select", {
    value: state.schema,
    disabled: state.loading || state.updating,
    onChange: (event) => updateFilter("schema", event.target.value),
  });
  schema.append(create("option", { value: "", text: "All" }));
  for (const option of DATA.options.schemas || []) {
    schema.append(create("option", { value: option.value, text: `${option.label} (${formatNumber(option.count)})` }));
  }
  schema.value = state.schema;

  const chapter = create("select", {
    value: state.chapter,
    disabled: state.loading || state.updating,
    onChange: (event) => updateFilter("chapter", event.target.value),
  });
  chapter.append(create("option", { value: "", text: "All" }));
  for (const option of DATA.options.chapters || []) {
    chapter.append(create("option", { value: option.value, text: `${option.label} (${formatNumber(option.count)})` }));
  }
  chapter.value = state.chapter;

  const search = create("input", {
    id: "filter-search",
    value: state.search,
    disabled: state.loading || state.updating,
    onInput: (event) => updateFilter("search", event.target.value, "filter-search"),
  });

  return create("div", { className: "dbuad-freesql-filters" }, [
    renderFilter("Schema", schema),
    renderFilter("Chapter", chapter),
    renderFilter("Search", search),
  ]);
}

function renderPager(pages) {
  const maxPage = maxPageFor(pages);
  const rows = create("select", {
    value: String(state.pageSize),
    disabled: state.loading || state.updating,
    onChange: (event) => {
      state.pageSize = Number(event.target.value || 12);
      state.page = 1;
      render();
    },
  });
  for (const size of PAGE_SIZE_OPTIONS) {
    rows.append(create("option", { value: String(size), text: String(size) }));
  }
  rows.value = String(state.pageSize);

  return create("div", { className: "dbuad-freesql-pager" }, [
    create("span", { text: `Page ${formatNumber(state.page)} of ${formatNumber(maxPage)}` }),
    create("div", { className: "dbuad-pager-actions dbuad-freesql-pager-actions" }, [
      renderFilter("Rows", rows),
      create("button", {
        className: "dbuad-button",
        type: "button",
        text: "Previous",
        disabled: state.page <= 1 || state.loading || state.updating,
        onClick: () => {
          state.page = Math.max(1, state.page - 1);
          render();
        },
      }),
      create("button", {
        className: "dbuad-button",
        type: "button",
        text: "Next",
        disabled: state.page >= maxPage || state.loading || state.updating,
        onClick: () => {
          state.page = Math.min(maxPage, state.page + 1);
          render();
        },
      }),
    ]),
  ]);
}

function renderBlock(block) {
  const blockId = String(block.blockId);
  const expanded = state.expandedSql.has(blockId);
  const runAction = block.freesqlUrl
    ? create("a", { className: "dbuad-link-button dbuad-link-button-primary", href: block.freesqlUrl, target: "_blank", rel: "noreferrer", text: "Run" })
    : create("button", { className: "dbuad-link-button", type: "button", text: "Run", disabled: true, ariaDisabled: true });
  const code = create("pre", { className: expanded ? "dbuad-code-sample" : "dbuad-code-sample is-hidden" }, [
    create("code", { text: block.approvedSql || "" }),
  ]);
  return create("article", { className: "dbuad-code-block-card", id: block.anchor }, [
    create("div", { className: "dbuad-code-block-header" }, [
      create("div", {}, [
        create("div", { className: "dbuad-badges" }, [
          badge(`Block ${block.blockOrdinal}`, "blue"),
          badge(block.schemaLabel || "Unknown schema", block.isPersonalSchema ? "green" : "neutral"),
        ]),
      ]),
      create("div", { className: "dbuad-code-block-actions" }, [
        runAction,
        create("button", { className: "dbuad-link-button", type: "button", text: "Copy", onClick: () => copyText(block.approvedSql || "", `Copied SQL for block ${block.blockId}`) }),
        create("button", {
          className: "dbuad-link-button",
          type: "button",
          text: expanded ? "Hide" : "Show",
          ariaExpanded: expanded,
          onClick: () => {
            if (expanded) {
              state.expandedSql.delete(blockId);
            } else {
              state.expandedSql.add(blockId);
            }
            render();
          },
        }),
      ]),
    ]),
    code,
  ]);
}

function renderPage(page) {
  return create("section", { className: "dbuad-freesql-page", id: page.anchor }, [
    create("div", { className: "dbuad-page-header" }, [
      create("div", {}, [
        create("h3", { text: `Page ${formatNumber(page.pageOrdinal)}: ${page.pageTitle}` }),
        create("p", { text: `${page.chapter || "No chapter"}${page.section ? ` / ${page.section}` : ""}` }),
      ]),
      create("div", { className: "dbuad-code-block-actions" }, [
        page.pageUrl
          ? create("a", {
              className: "dbuad-link-button",
              href: page.pageUrl,
              target: "_blank",
              rel: "noreferrer",
              title: page.pageUrl,
              text: "Source",
            })
          : null,
      ]),
    ]),
    create("div", { className: "dbuad-code-block-list" }, (page.visibleBlocks || []).map(renderBlock)),
  ]);
}

function renderBody() {
  const pages = visiblePages();
  const visible = pagedPages(pages);
  const children = [
    state.openDataPrompt ? renderOpenDataPanel(state.openDataPrompt) : null,
    state.loadError ? renderOpenDataPanel(state.loadError, true) : null,
    state.updateStatus ? create("div", { className: "dbuad-status-note", text: state.updateStatus }) : null,
  ];

  if (!state.loading && !DATA.available && !state.loadError && !state.openDataPrompt) {
    children.push(create("div", { className: "dbuad-progress-panel" }, [
      create("p", { text: DATA.message || "No approved FreeSQL code blocks are available." }),
    ]));
  }

  if (DATA.available) {
    children.push(renderFilters());
    children.push(renderPager(pages));
    children.push(
      visible.length
        ? create("div", { className: "dbuad-freesql-pages" }, visible.map(renderPage))
        : create("div", { className: "dbuad-progress-panel" }, [
            create("p", { text: DATA.available ? "No FreeSQL code blocks match the current filters." : DATA.message }),
          ])
    );
  }

  return create("div", { className: "dbuad-freesql-body" }, [
    create("div", { className: "dbuad-freesql-stack" }, children),
  ]);
}

function render(focusId = "") {
  const surface = create("section", { className: "dbuad-work-surface", role: "region" }, [
    create("div", { className: "dbuad-redwood-strip" }),
    renderHeader(),
    renderBody(),
  ]);
  app.replaceChildren(surface, state.copiedMessage ? create("div", { className: "toast", text: state.copiedMessage }) : null);
  if (focusId) {
    const focusTarget = document.getElementById(focusId);
    if (focusTarget) {
      focusTarget.focus();
      if (focusTarget.setSelectionRange) {
        const length = focusTarget.value.length;
        focusTarget.setSelectionRange(length, length);
      }
    }
  }
}

render();
loadLocalData();
window.addEventListener("hashchange", () => expandFromHash(true));
  </script>
  <noscript>
    <main class="shell">
      <section class="dbuad-work-surface">
        <div class="dbuad-redwood-strip" aria-hidden="true"></div>
        <div class="dbuad-surface-header">
          <div class="dbuad-header-title">
            <p class="dbuad-kicker">Workflow</p>
            <h1>View Code Blocks</h1>
          </div>
          <div class="dbuad-badges">
            <span class="dbuad-badge dbuad-badge-neutral">2026.06</span>
          </div>
        </div>
        <div class="dbuad-freesql-body">
          <p>JavaScript is required to view this interactive snapshot.</p>
        </div>
      </section>
    </main>
  </noscript>
</body>
