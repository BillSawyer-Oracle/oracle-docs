:root {
  color-scheme: light;
  --bg: #f6f8f7;
  --surface: rgba(255, 255, 255, 0.92);
  --surface-strong: #ffffff;
  --border: rgba(60, 69, 69, 0.16);
  --text: #1f2a2a;
  --muted: #657171;
  --accent: #1f7a68;
  --accent-strong: #176453;
  --code-bg: rgba(60, 69, 69, 0.06);
  --shadow: 0 12px 30px rgba(31, 42, 42, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.45;
}

a {
  color: inherit;
}

.shell {
  width: min(1280px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0 40px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
  box-shadow: var(--shadow);
}

.stack {
  display: grid;
  gap: 18px;
}

.row {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.title-stack {
  display: grid;
  gap: 4px;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  font-size: clamp(1.35rem, 1.8vw, 1.85rem);
  letter-spacing: 0;
}

h2 {
  font-size: 1rem;
  letter-spacing: 0;
}

h3 {
  font-size: 0.96rem;
  letter-spacing: 0;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 0.86rem;
}

.tiny {
  font-size: 0.76rem;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.metric {
  display: grid;
  gap: 3px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  background: var(--surface-strong);
}

.metric span:first-child {
  color: var(--muted);
  font-size: 0.78rem;
}

.metric span:last-child {
  font-weight: 700;
}

.filters {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr 1fr;
  gap: 12px;
  align-items: end;
}

label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
}

input,
select {
  width: 100%;
  min-height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  padding: 8px 10px;
  font: inherit;
}

.button-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.button {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  padding: 7px 12px;
  font: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

.button:hover {
  border-color: rgba(31, 122, 104, 0.42);
}

.button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.button.primary:hover {
  background: var(--accent-strong);
}

.button.ghost {
  background: transparent;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 23px;
  border-radius: 999px;
  padding: 2px 9px;
  background: rgba(60, 69, 69, 0.08);
  color: #344242;
  font-size: 0.74rem;
  font-weight: 800;
}

.badge.green {
  background: rgba(31, 122, 104, 0.12);
  color: #135c4d;
}

.badge.blue {
  background: rgba(43, 108, 176, 0.12);
  color: #24598f;
}

.badge.purple {
  background: rgba(108, 84, 160, 0.14);
  color: #59438d;
}

.page-tools {
  display: flex;
  gap: 12px;
  align-items: end;
  justify-content: space-between;
  flex-wrap: wrap;
}

.jump-control {
  min-width: min(360px, 100%);
}

.is-hidden {
  display: none !important;
}

.page-group {
  scroll-margin-top: 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  overflow: hidden;
}

.page-header {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 16px 18px;
  text-align: left;
  cursor: pointer;
}

.page-header:hover {
  background: rgba(31, 122, 104, 0.05);
}

.page-header:focus {
  outline: 2px solid rgba(31, 122, 104, 0.36);
  outline-offset: -2px;
}

.page-body {
  display: grid;
  gap: 12px;
  padding: 0 18px 18px;
}

.block-card {
  scroll-margin-top: 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-strong);
  padding: 14px;
}

.code {
  margin: 12px 0 0;
  overflow-x: auto;
  border-radius: 8px;
  background: var(--code-bg);
  padding: 12px;
  font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 0.86rem;
  line-height: 1.5;
  white-space: pre;
}

.empty {
  border: 1px dashed var(--border);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.72);
  padding: 18px;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  max-width: min(360px, calc(100% - 40px));
  border-radius: 8px;
  background: #1f2a2a;
  color: #fff;
  padding: 10px 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
  font-size: 0.86rem;
}

.footer {
  color: var(--muted);
  font-size: 0.78rem;
  padding: 4px 2px;
}

@media (max-width: 900px) {
  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .filters {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 620px) {
  .shell {
    width: min(100% - 20px, 1280px);
    padding-top: 16px;
  }

  .metrics,
  .filters {
    grid-template-columns: 1fr;
  }

  .row {
    align-items: stretch;
  }

  .button-row {
    width: 100%;
  }

  .button {
    flex: 1 1 auto;
  }

  .page-tools {
    align-items: stretch;
  }
}

  <script>
const app = document.getElementById("app");
const embeddedDataNode = document.getElementById("freesql-embedded-data");
let DATA = normalizeData(parseArtifactData(embeddedDataNode ? embeddedDataNode.textContent : "{}"));
const state = {
  search: "",
  schema: "",
  classification: "",
  chapter: "",
  expandedPages: new Set(),
  expandedSql: new Set(),
  copiedMessage: "",
  updateStatus: "",
  updating: false,
};

function emptyData() {
  return {
    available: false,
    message: "No approved runnable code blocks are embedded in this artifact.",
    selectedSource: null,
    summary: {
      approvedBlockCount: 0,
      pageCount: 0,
      schemaCount: 0,
      latestTestedAt: null,
      generatedAt: null,
    },
    options: { schemas: [], classifications: [], chapters: [] },
    pages: [],
    remoteDataUrl: "",
  };
}

function parseArtifactData(raw) {
  try {
    return JSON.parse(raw || "{}");
  } catch {
    return emptyData();
  }
}

function validArtifactData(value) {
  return Boolean(value && typeof value === "object" && value.summary && Array.isArray(value.pages));
}

function normalizeData(value) {
  if (!validArtifactData(value)) {
    return emptyData();
  }
  return {
    ...emptyData(),
    ...value,
    summary: { ...emptyData().summary, ...(value.summary || {}) },
    options: { ...emptyData().options, ...(value.options || {}) },
    pages: Array.isArray(value.pages) ? value.pages : [],
  };
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString();
}

function formatDate(value) {
  if (!value) {
    return "Unknown";
  }
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) {
    return String(value);
  }
  return parsed.toLocaleString();
}

function labelFromCode(value) {
  return String(value || "")
    .toLowerCase()
    .split("_")
    .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");
}

function compactUrl(value) {
  if (!value) {
    return "Source unavailable";
  }
  try {
    const parsed = new URL(value);
    return `${parsed.hostname}${parsed.pathname}`;
  } catch {
    return String(value);
  }
}

function create(tag, options = {}, children = []) {
  const node = document.createElement(tag);
  if (options.className) {
    node.className = options.className;
  }
  if (options.id) {
    node.id = options.id;
  }
  if (options.text !== undefined) {
    node.textContent = String(options.text);
  }
  if (options.href) {
    node.href = options.href;
  }
  if (options.title) {
    node.title = options.title;
  }
  if (options.target) {
    node.target = options.target;
  }
  if (options.rel) {
    node.rel = options.rel;
  }
  if (options.disabled !== undefined) {
    node.disabled = Boolean(options.disabled);
  }
  if (options.role) {
    node.setAttribute("role", options.role);
  }
  if (options.tabIndex !== undefined) {
    node.tabIndex = options.tabIndex;
  }
  if (options.type) {
    node.type = options.type;
  }
  if (options.value !== undefined) {
    node.value = options.value;
  }
  if (options.ariaExpanded !== undefined) {
    node.setAttribute("aria-expanded", String(options.ariaExpanded));
  }
  if (options.onClick) {
    node.addEventListener("click", options.onClick);
  }
  if (options.onInput) {
    node.addEventListener("input", options.onInput);
  }
  if (options.onChange) {
    node.addEventListener("change", options.onChange);
  }
  if (options.onKeyDown) {
    node.addEventListener("keydown", options.onKeyDown);
  }
  for (const child of children) {
    if (child === null || child === undefined) {
      continue;
    }
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function badge(text, tone = "") {
  return create("span", { className: `badge ${tone}`.trim(), text });
}

function metric(label, value) {
  return create("div", { className: "metric" }, [
    create("span", { text: label }),
    create("span", { text: value }),
  ]);
}

function filterActive() {
  return Boolean(state.search || state.schema || state.classification || state.chapter);
}

function pageSearchText(page) {
  return [page.pageTitle, page.chapter, page.section, page.pageUrl, `page ${page.pageOrdinal}`]
    .filter(Boolean)
    .join(" ")
    .toUpperCase();
}

function blockSearchText(block) {
  return [
    block.blockId,
    block.blockOrdinal,
    block.schemaName,
    block.schemaLabel,
    block.classification,
    block.commandLabel,
    block.approvedSql,
  ]
    .filter(Boolean)
    .join(" ")
    .toUpperCase();
}

function visiblePages() {
  const search = state.search.trim().toUpperCase();
  return (DATA.pages || [])
    .map((page) => {
      if (state.chapter && page.chapter !== state.chapter) {
        return null;
      }
      const pageHit = !search || pageSearchText(page).includes(search);
      const blocks = (page.blocks || []).filter((block) => {
        if (state.schema && block.schemaName !== state.schema) {
          return false;
        }
        if (state.classification && block.classification !== state.classification) {
          return false;
        }
        if (search && !pageHit && !blockSearchText(block).includes(search)) {
          return false;
        }
        return true;
      });
      return blocks.length ? { ...page, visibleBlocks: blocks } : null;
    })
    .filter(Boolean);
}

function updateFilter(key, value, focusId = "") {
  state[key] = value;
  render(focusId);
}

function remoteDataUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    return params.get("dataUrl") || DATA.remoteDataUrl || "";
  } catch {
    return DATA.remoteDataUrl || "";
  }
}

async function updateData() {
  const url = remoteDataUrl();
  if (!url) {
    state.updateStatus = "No remote data URL is configured. Add ?dataUrl=RAW_JSON_URL or regenerate with FREESQL_APPROVED_DATA_URL.";
    showToast("No remote data URL configured.");
    render();
    return;
  }
  state.updating = true;
  state.updateStatus = `Updating from ${compactUrl(url)}...`;
  render();
  try {
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const downloadedData = await response.json();
    if (!validArtifactData(downloadedData)) {
      throw new Error("The downloaded JSON is not a FreeSQL code block data file.");
    }
    DATA = normalizeData(downloadedData);
    state.search = "";
    state.schema = "";
    state.classification = "";
    state.chapter = "";
    state.expandedPages.clear();
    state.expandedSql.clear();
    state.updateStatus = `Updated data generated ${formatDate(DATA.summary.generatedAt)}.`;
    showToast("Latest data loaded.");
  } catch (error) {
    state.updateStatus = `Update failed: ${error.message}. Showing embedded data.`;
    showToast("Update failed. Showing embedded data.");
  } finally {
    state.updating = false;
    render();
  }
}

function togglePage(page) {
  if (state.expandedPages.has(page.anchor)) {
    state.expandedPages.delete(page.anchor);
  } else {
    state.expandedPages.add(page.anchor);
  }
  render();
}

function jumpToPage(anchor) {
  if (!anchor) {
    return;
  }
  state.expandedPages.add(anchor);
  render();
  window.location.hash = anchor;
  window.requestAnimationFrame(() => {
    const target = document.getElementById(anchor);
    if (target) {
      target.scrollIntoView({ block: "start" });
    }
  });
}

function expandFromHash(scroll = true) {
  const anchor = decodeURIComponent(window.location.hash.replace(/^#/, ""));

    return;

    return candidate.anchor === anchor || (candidate.blocks || []).some((block) => block.anchor === anchor);
  });
  if (!page) {
    return;
  }
  state.expandedPages.add(page.anchor);
  const block = (page.blocks || []).find((candidate) => candidate.anchor === anchor);
  if (block) {
    state.expandedSql.add(String(block.blockId));
  }
  render();
  if (scroll) {
    window.requestAnimationFrame(() => {
      const target = document.getElementById(anchor);
      if (target) {
        target.scrollIntoView({ block: "start" });
      }
    });
  }
}

function showToast(message) {
  state.copiedMessage = message;
  render();
  window.setTimeout(() => {
    state.copiedMessage = "";
    render();
  }, 1800);
}

async function copyText(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text || "");
    } else {
      const textArea = document.createElement("textarea");
      textArea.value = text || "";
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand("copy");
      textArea.remove();
    }
    showToast(label);
  } catch {
    const textArea = document.createElement("textarea");
    textArea.value = text || "";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    showToast("Copy blocked. The text is selected for manual copy.");
  }
}

function renderFilter(labelText, control) {
  return create("label", {}, [create("span", { text: labelText }), control]);
}

function renderFilters() {
  const search = create("input", {
    id: "filter-search",
    value: state.search,
    onInput: (event) => updateFilter("search", event.target.value, "filter-search"),
  });
  const schema = create("select", {
    value: state.schema,
    onChange: (event) => updateFilter("schema", event.target.value),
  });
  schema.append(create("option", { value: "", text: "All" }));
  for (const option of DATA.options.schemas || []) {
    schema.append(create("option", { value: option.value, text: `${option.label} (${formatNumber(option.count)})` }));
  }
  schema.value = state.schema;

  const command = create("select", {
    value: state.classification,
    onChange: (event) => updateFilter("classification", event.target.value),
  });
  command.append(create("option", { value: "", text: "All" }));
  for (const option of DATA.options.classifications || []) {
    command.append(create("option", { value: option.value, text: `${labelFromCode(option.label)} (${formatNumber(option.count)})` }));
  }
  command.value = state.classification;

  const chapter = create("select", {
    value: state.chapter,
    onChange: (event) => updateFilter("chapter", event.target.value),
  });
  chapter.append(create("option", { value: "", text: "All" }));
  for (const option of DATA.options.chapters || []) {
    chapter.append(create("option", { value: option.value, text: `${option.label} (${formatNumber(option.count)})` }));
  }
  chapter.value = state.chapter;

  return create("section", { className: "panel filters", id: "filters" }, [
    renderFilter("Search", search),
    renderFilter("Schema", schema),
    renderFilter("Command", command),
    renderFilter("Chapter", chapter),
  ]);
}

function renderHeader() {
  const source = DATA.selectedSource || {};
  const sourceName = source.guideName || source.bookCode || "No approved source selected";
  const dataUrl = remoteDataUrl();
  return create("section", { className: "panel" }, [
    create("div", { className: "row" }, [
      create("div", { className: "title-stack" }, [
        create("div", { className: "button-row" }, [
          create("h1", { text: "Approved FreeSQL Code Blocks" }),
          badge(DATA.available ? "Available" : "Unavailable", DATA.available ? "green" : ""),
          badge(source.environment || "PROD"),
        ]),
        create("p", { className: "muted small", text: `${sourceName} ${source.version || ""}`.trim() }),
        create("p", {
          className: "muted tiny",
          text: state.updateStatus || (dataUrl ? `Remote data: ${compactUrl(dataUrl)}` : "Using embedded snapshot data"),
        }),
      ]),
      create("div", { className: "button-row" }, [
        create("button", {
          className: "button ghost",
          type: "button",
          text: state.updating ? "Updating..." : "Update data",
          disabled: state.updating,
          title: dataUrl || "Add ?dataUrl=RAW_JSON_URL or regenerate with FREESQL_APPROVED_DATA_URL.",
          onClick: updateData,
        }),
      ]),
    ]),
    create("div", { className: "metrics" }, [
      metric("Approved blocks", formatNumber(DATA.summary.approvedBlockCount)),
      metric("Pages", formatNumber(DATA.summary.pageCount)),
      metric("Schemas", formatNumber(DATA.summary.schemaCount)),
      metric("Latest tested", formatDate(DATA.summary.latestTestedAt)),
      metric("Generated", formatDate(DATA.summary.generatedAt)),
    ]),
  ]);
}

function renderPageTools(pages) {
  if (!pages.length) {
    return null;
  }
  const jump = create("select", {
    value: "",
    onChange: (event) => {
      jumpToPage(event.target.value);
      event.target.value = "";
    },
  });
  jump.append(create("option", { value: "", text: "Jump to page" }));
  for (const page of pages) {
    jump.append(create("option", { value: page.anchor, text: `Page ${page.pageOrdinal}: ${page.pageTitle}` }));
  }
  jump.value = "";
  return create("section", { className: "panel page-tools" }, [
    create("div", { className: "title-stack" }, [
      create("h2", { text: `${formatNumber(pages.length)} visible pages` }),
      create("p", { className: "muted small", text: `${formatNumber(DATA.summary.pageCount)} pages in this snapshot` }),
    ]),
    renderFilter("Jump", jump),
    create("div", { className: "button-row" }, [
      create("button", {
        className: "button ghost",
        type: "button",
        text: "Expand all visible",
        onClick: () => {
          for (const page of pages) {
            state.expandedPages.add(page.anchor);
          }
          render();
        },
      }),
      create("button", {
        className: "button ghost",
        type: "button",
        text: "Collapse all",
        onClick: () => {
          state.expandedPages.clear();
          state.expandedSql.clear();
          render();
        },
      }),
    ]),
  ]);
}

function renderBlock(block) {
  const blockId = String(block.blockId);
  const expanded = state.expandedSql.has(blockId);
  const code = create("pre", { className: expanded ? "code" : "code is-hidden" }, [create("code", { text: block.approvedSql || "" })]);
  return create("article", { className: "block-card", id: block.anchor }, [
    create("div", { className: "row" }, [
      create("div", { className: "title-stack" }, [
        create("div", { className: "button-row" }, [
          badge(`Block ${block.blockOrdinal}`, "blue"),
          badge(block.schemaLabel || "Unknown schema", block.isPersonalSchema ? "green" : ""),
          block.testStatus ? badge(labelFromCode(block.testStatus), "green") : null,
          badge(labelFromCode(block.classification), "purple"),
        ]),
        create("p", { className: "muted tiny", text: `Tested ${formatDate(block.testedAt)} | ID ${block.blockId}` }),
      ]),
      create("div", { className: "button-row" }, [
        create("a", { className: "button primary", href: block.freesqlUrl, target: "_blank", rel: "noreferrer", text: "RUN in FREESQL" }),
        create("button", { className: "button", type: "button", text: "Copy SQL", onClick: () => copyText(block.approvedSql || "", `Copied SQL for block ${block.blockId}`) }),
        create("button", { className: "button", type: "button", text: "Copy FreeSQL URL", onClick: () => copyText(block.freesqlUrl || "", `Copied FreeSQL URL for block ${block.blockId}`) }),
        create("button", {
          className: "button",
          type: "button",
          text: expanded ? "Hide SQL" : "Show SQL",
          ariaExpanded: expanded,
          onClick: () => {
            if (expanded) {
              state.expandedSql.delete(blockId);
            } else {
              state.expandedSql.add(blockId);
            }
            render();
          },
        }),
      ]),
    ]),
    code,
  ]);
}

function renderPage(page) {
  const expanded = filterActive() || state.expandedPages.has(page.anchor);
  const body = create("div", { className: expanded ? "page-body" : "page-body is-hidden" }, (page.visibleBlocks || []).map(renderBlock));
  return create("section", { className: "page-group", id: page.anchor }, [
    create("div", {
      className: "page-header",
      role: "button",
      tabIndex: 0,
      ariaExpanded: expanded,
      onClick: (event) => {
        if (event.target.closest("a,button,select,input,textarea")) {
          return;
        }
        togglePage(page);
      },
      onKeyDown: (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          togglePage(page);
        }
      },
    }, [
      create("div", { className: "row" }, [
        create("div", { className: "title-stack" }, [
          create("h2", { text: `${expanded ? "v" : ">"} Page ${page.pageOrdinal}: ${page.pageTitle}` }),
          create("p", { className: "muted small", text: `${page.chapter || "No chapter"}${page.section ? ` / ${page.section}` : ""}` }),
        ]),
        create("div", { className: "button-row" }, [
          badge(`${formatNumber(page.visibleBlocks.length)} blocks`),
          create("a", {
            className: "button",
            href: page.pageUrl,
            target: "_blank",
            rel: "noreferrer",
            title: page.pageUrl,
            text: "Source",
          }),
        ]),
      ]),
    ]),
    body,
  ]);
}

function renderFooter() {
  const source = DATA.selectedSource || {};
  const parts = [
    source.bookCode || "Unknown book",
    source.version ? `version ${source.version}` : "",
    source.environment || "Unknown environment",
    source.guideName || "",
  ].filter(Boolean);
  return create("footer", { className: "footer", text: `Snapshot provenance: ${parts.join(" | ")}.` });
}

function render(focusId = "") {
  const pages = visiblePages();
  app.replaceChildren(
    create("div", { className: "stack" }, [
      renderHeader(),
      renderFilters(),
      DATA.available && pages.length ? renderPageTools(pages) : null,
      pages.length
        ? create("div", { className: "stack" }, pages.map(renderPage))
        : create("div", { className: "empty" }, [
            create("h2", { text: DATA.available ? "No visible blocks match" : "No approved runnable code blocks" }),
            create("p", {
              className: "muted small",
              text: DATA.available ? "Change or clear the filters to show approved blocks." : DATA.message,
            }),
          ]),
      renderFooter(),
      state.copiedMessage ? create("div", { className: "toast", text: state.copiedMessage }) : null,
    ])
  );
  if (focusId) {
    const focusTarget = document.getElementById(focusId);
    if (focusTarget) {
      focusTarget.focus();
      if (focusTarget.setSelectionRange) {
        const length = focusTarget.value.length;
        focusTarget.setSelectionRange(length, length);
      }
    }
  }
}

render();
expandFromHash(false);
window.addEventListener("hashchange", () => expandFromHash(true));
  </script>
  <noscript>
    <main class="shell">
      <section class="panel">
        <h1>Approved FreeSQL Code Blocks</h1>
        <p class="muted small">JavaScript is required to view this interactive snapshot.</p>
      </section>
    </main>
  </noscript>
</body>
</html>
